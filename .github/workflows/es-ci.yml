name: Validar versión en español
on:
  push:
    branches: [jolufasoft/es-seguro]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci --ignore-scripts
      - run: npm run check:locale
      - run: bash -n scripts/instalar-es.sh
      - run: mvn -B -Dtest=JwtSecurityTest,KeyStorageSecurityTest,AccessSecurityTest verify
