<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de IP</title>
<style>body{font:16px system-ui;margin:24px;color:#243247;background:#f5f7fa}main{max-width:760px;margin:auto;padding:24px;background:white;border-radius:12px}form{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border:1px solid #bbc5d3;border-radius:6px}input{flex:1;min-width:180px}button{background:#2563eb;color:white;cursor:pointer}p{line-height:1.6}dt{font-weight:600}dd{margin:0 0 14px;overflow-wrap:anywhere}.dark body{background:#1a1f2e;color:#eee}.dark main{background:#252c3c}</style></head>
<body><main><h1>Consulta de IP</h1><p>La consulta se envía a ipapi.co cuando pulsas Consultar. Deja el campo vacío para consultar tu IP pública.</p>
<form id="query"><input id="ip" aria-label="Dirección IP" placeholder="Dirección IPv4 o IPv6" autocomplete="off"><button>Consultar</button></form>
<p id="status" role="status"></p><dl id="result"></dl></main>
<script>
if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');
const form=document.getElementById('query'),status=document.getElementById('status'),result=document.getElementById('result');
function valid(ip){if(ip.includes(':')){try{return !!new URL('http://['+ip+']/').hostname}catch{return false}}return /^(\d{1,3}\.){3}\d{1,3}$/.test(ip)&&ip.split('.').every(x=>Number(x)<=255)}
form.addEventListener('submit',async event=>{event.preventDefault();const ip=document.getElementById('ip').value.trim();result.replaceChildren();if(ip&&!valid(ip)){status.textContent='Introduce una dirección IP válida';return}status.textContent='Consultando...';form.querySelector('button').disabled=true;
try{const response=await fetch('https://ipapi.co/'+(ip?encodeURIComponent(ip)+'/':'')+'json/',{referrerPolicy:'no-referrer'});if(!response.ok)throw new Error('El proveedor no pudo completar la consulta');const data=await response.json();if(data.error)throw new Error('No se pudo consultar esta IP');
for(const [key,label] of Object.entries({ip:'Dirección IP',network:'Red',hostname:'Nombre del host',country_name:'País',region:'Región',city:'Ciudad',org:'Organización',asn:'ASN',postal:'Código postal',timezone:'Zona horaria',latitude:'Latitud',longitude:'Longitud'})){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=data[key]??'Sin datos';result.append(dt,dd)}
if(Number.isFinite(data.latitude)&&Number.isFinite(data.longitude)){const link=document.createElement('a');link.textContent='Ver ubicación aproximada en OpenStreetMap';link.href='https://www.openstreetmap.org/?mlat='+data.latitude+'&mlon='+data.longitude+'#map=10/'+data.latitude+'/'+data.longitude;link.target='_blank';link.rel='noopener noreferrer';result.append(link)}status.textContent='Consulta completada';
}catch{status.textContent='No se pudo completar la consulta. Comprueba la conexión o inténtalo más tarde.'}finally{form.querySelector('button').disabled=false}});
</script></body></html>
